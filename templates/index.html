<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PhishGuard - URL Detector</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <nav>
        <div class="logo">🛡 PhishGuard</div>
        <div class="nav-text">Phishing URL Detection</div>
    </nav>

    <main>

        <section class="hero">

            <div class="badge">
                CYBER SECURITY TOOL
            </div>

            <h1>
                Detect
                <span>Phishing URLs</span>
            </h1>

            <p>
                Analyze a website URL and identify suspicious
                characteristics before visiting it.
            </p>

            <div class="scanner">

                <input
                    type="text"
                    id="urlInput"
                    placeholder="Enter website URL..."
                >

                <button onclick="scanURL()">
                    Scan URL
                </button>

            </div>

            <div id="loading" class="loading">
                Analyzing URL...
            </div>

            <div id="result" class="result">

                <div class="score-section">

                    <div class="score" id="score">
                        0%
                    </div>

                    <div>
                        <h2 id="status">
                            Result
                        </h2>

                        <p>
                            Risk Score
                        </p>
                    </div>

                </div>

                <div class="details">

                    <h3>Analysis</h3>

                    <ul id="reasons"></ul>

                </div>

                <div class="recommendation">

                    <strong>Recommendation:</strong>

                    <p id="recommendation"></p>

                </div>

            </div>

        </section>

    </main>

    <footer>
        PhishGuard © 2026 | Educational Cybersecurity Project
    </footer>

    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>
